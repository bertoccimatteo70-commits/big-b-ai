# ITAGPT — build configuration
# The build is deliberately single-worker friendly: it must succeed on 2-core
# CI runners and on developer laptops with limited RAM.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configureondemand=false

# Compile Kotlin inside the Gradle daemon: avoids a second JVM (~1.5 GB).
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.suppressUnsupportedCompileSdk=35
