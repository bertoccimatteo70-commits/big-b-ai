name: Apply staged 1.2.0 update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify, apply and push
        env:
          PATCH_URL: https://paste.rs/WKHxp
          PATCH_SHA256: 478a64ef5e98d2e4081363460136912fe4542486cd8259a8bf7ccb03e674a9b7
        run: |
          set -euo pipefail
          curl -fsSL "$PATCH_URL" -o /tmp/update.patch.xz
          echo "$PATCH_SHA256  /tmp/update.patch.xz" | sha256sum -c -
          xz -d -c /tmp/update.patch.xz > /tmp/update.patch
          git apply --check /tmp/update.patch
          git apply /tmp/update.patch
          git config user.name "bigb-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden attachments and ship 1.2.0"
          git push origin HEAD:main
