name: apply-1.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scarica la patch
        run: |
          set -euo pipefail
          curl -fsSL https://files.catbox.moe/2eur7n.patch -o /tmp/bigb-1.4.patch
          echo "994f2e7ffdcbc11372aea26c0120c51d0cdcf015d6049c9502d49e714ff3001d  /tmp/bigb-1.4.patch" | sha256sum -c -
      - name: Applica
        run: |
          set -euo pipefail
          git apply --index --binary /tmp/bigb-1.4.patch
          git config user.name "BIG B AI"
          git config user.email "bigbai@users.noreply.github.com"
          git commit -m "BIG B AI 1.4.0: agente Code, quota giornaliera, risposte complete, Tinos, animazioni"
      - name: Pubblica
        run: git push origin HEAD:main
