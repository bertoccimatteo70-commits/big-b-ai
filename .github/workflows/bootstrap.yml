name: Import sources (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify sources
        run: |
          set -euo pipefail
          URL1="https://files.catbox.moe/6tppge.xz"
          URL2="https://h.uguu.se/aKxzjbhnZFFy.xz"
          SHA="11f1d8abfdb8f81be5e133ee6fecef069eedf0739dd45994e1c9f921b79312a5"
          ok=0
          for u in "$URL1" "$URL2"; do
            echo "trying $u"
            if timeout 120 curl -fsSL --connect-timeout 10 --max-time 100 --retry 1 -o /tmp/sources.tar.xz "$u"; then
              if echo "$SHA  /tmp/sources.tar.xz" | sha256sum -c -; then ok=1; break; fi
            fi
            echo "mirror failed: $u"
          done
          [ "$ok" = "1" ] || { echo "ERROR: archive download or checksum failed"; exit 1; }
          tar -xJf /tmp/sources.tar.xz -C .
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ls -la

      - name: Commit imported sources
        run: |
          set -euo pipefail
          git rm -q .github/workflows/bootstrap.yml
          git config user.name "BIG B AI"
          git config user.email "dev@bigbai.local"
          git add -A
          git commit -m "feat: import BIG B AI 1.0.0 sources (chat, models, memory, BIG B Code)"
          git push origin HEAD:main
