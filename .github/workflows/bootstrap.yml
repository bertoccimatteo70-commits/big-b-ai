name: Import sources (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify sources
        run: |
          set -uo pipefail
          SHA="11f1d8abfdb8f81be5e133ee6fecef069eedf0739dd45994e1c9f921b79312a5"
          : > /tmp/mirrors.log
          ok=0
          for u in "https://x0.at/jzCc.xz" "https://files.catbox.moe/6tppge.xz" "https://h.uguu.se/aKxzjbhnZFFy.xz"; do
            code=$(timeout 120 curl -sSL --connect-timeout 10 --max-time 100 -o /tmp/sources.tar.xz -w '%{http_code}' "$u" 2>>/tmp/mirrors.log || echo "curl-fail")
            echo "$u -> HTTP $code, $(wc -c < /tmp/sources.tar.xz 2>/dev/null || echo 0) bytes" >> /tmp/mirrors.log
            if [ "$code" = "200" ] && echo "$SHA  /tmp/sources.tar.xz" | sha256sum -c - >> /tmp/mirrors.log 2>&1; then
              ok=1
              break
            fi
          done
          cat /tmp/mirrors.log
          if [ "$ok" != "1" ]; then
            echo "ERROR: no mirror delivered a valid archive"
            exit 1
          fi
          tar -xJf /tmp/sources.tar.xz -C .
          # Workflow files are not modified here: GITHUB_TOKEN is not allowed to
          # create or update them. android.yml is already identical to the repo.
          git checkout -- .github/workflows/android.yml 2>/dev/null || true
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ls -la

      - name: Commit imported sources
        run: |
          set -euo pipefail
          git config user.name "BIG B AI"
          git config user.email "dev@bigbai.local"
          git add -A
          git commit -m "feat: import BIG B AI 1.0.0 sources (chat, models, memory, BIG B Code)"
          git push origin HEAD:main
