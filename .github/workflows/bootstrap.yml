name: Import sources (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify sources
        run: |
          set -euo pipefail
          URL1="https://n.uguu.se/YxazJbUjzFAM.xz"
          URL2="https://files.catbox.moe/mukoaa.xz"
          SHA="7467be01061b81ad0515c861111d9f32677b5a675c2b77bcf0859f92466d5983"
          ok=0
          for u in "$URL1" "$URL2"; do
            if curl -fsSL --retry 3 --retry-delay 2 -o /tmp/sources.tar.xz "$u"; then
              if echo "$SHA  /tmp/sources.tar.xz" | sha256sum -c -; then ok=1; break; fi
            fi
          done
          [ "$ok" = "1" ] || { echo "ERROR: archive download or checksum failed"; exit 1; }
          tar -xJf /tmp/sources.tar.xz -C .
          ls -la

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate Gradle wrapper
        run: |
          set -euo pipefail
          mkdir -p /tmp/wrap && cd /tmp/wrap
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          cd "$GITHUB_WORKSPACE"
          cp /tmp/wrap/gradlew /tmp/wrap/gradlew.bat .
          mkdir -p gradle/wrapper
          cp /tmp/wrap/gradle/wrapper/gradle-wrapper.jar /tmp/wrap/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
          chmod +x gradlew

      - name: Commit imported sources
        run: |
          set -euo pipefail
          git rm -q .github/workflows/bootstrap.yml
          git config user.name "BIG B AI"
          git config user.email "dev@bigbai.local"
          git add -A
          git commit -m "feat: import BIG B AI 1.0.0 sources (chat, models, memory, BIG B Code)"
          git push origin HEAD:main
