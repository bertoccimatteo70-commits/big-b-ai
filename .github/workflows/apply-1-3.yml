name: Apply 1.3.0 patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Download patch and verify SHA-256
        env:
          PATCH_URL: https://paste.rs/JTSzr
        run: |
          curl -fsSL "$PATCH_URL" -o /tmp/bigb-1.3.patch
          echo "8d83497bb19e8759d207c63a217bd0fbfc26160d61de47a18f1ebbbe76b47ebb  /tmp/bigb-1.3.patch" | sha256sum -c -

      - name: Apply patch and push
        run: |
          git config user.name "BIG B AI Bot"
          git config user.email "bot@users.noreply.github.com"
          git apply --index /tmp/bigb-1.3.patch
          git commit -m "feat: BIG B AI 1.3.0 with three ABIs, new navigation and file tools"
          git push origin HEAD:main

      - name: Summary
        run: |
          git log --oneline -2
          git show --stat --oneline HEAD | tail -5
