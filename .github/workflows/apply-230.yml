name: apply-230
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: |
          set -euo pipefail
          curl -fsSL https://files.catbox.moe/ife0jc.patch -o /tmp/230.patch
          git apply --index /tmp/230.patch
          git config user.name "ITAGPT"
          git config user.email "itagpt@users.noreply.github.com"
          git commit -m "feat(code): ITAGPT 2.3.0 — terminale, verifica reale, AgentRunner e rollback"
          git push origin HEAD:main
