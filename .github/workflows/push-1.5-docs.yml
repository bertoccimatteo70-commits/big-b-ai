name: push-1.5-docs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply the 1.5.0 docs patch and push
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/1.5-docs.patch "https://files.catbox.moe/lajxfu.patch"
          echo "patch bytes: $(stat -c%s /tmp/1.5-docs.patch)"
          sha256sum /tmp/1.5-docs.patch
          git apply --index /tmp/1.5-docs.patch
          git -c user.name="BIG B AI" -c user.email="noreply@bigbai.local" \
            commit -m "docs: audit 1.5.0 e soglia di retrieval a 0.80"
          git push origin HEAD:main
