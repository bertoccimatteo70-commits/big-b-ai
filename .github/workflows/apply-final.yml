name: Apply final 1.2.0 update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified patch
        env:
          PATCH_URL: https://paste.rs/3DGZo
          PATCH_SHA256: 780dbcfc615dc9a795c697d6007e4be6967139e8216910eba9045eb30e71ad90
        run: |
          set -euo pipefail
          curl -fsSL "$PATCH_URL" -o /tmp/final.patch
          echo "$PATCH_SHA256  /tmp/final.patch" | sha256sum -c -
          git apply --index /tmp/final.patch
          git config user.name "bigb-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: correct inference metrics and bound project reads"
          git push origin HEAD:main
