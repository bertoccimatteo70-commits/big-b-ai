name: Android CI - Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3 requested the `tools` package by default.
      # Google removed it from the SDK repository, so the action failed with
      # "Failed to find package 'tools'". v4 no longer requests it; the command
      # line tools it installs replace it.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch llama.cpp (pinned revision)
        run: bash scripts/fetch-llama.sh

      - name: Build native library (arm64-v8a, CPU only)
        run: bash scripts/build-native.sh

      - name: Unit tests (JVM)
        run: ./gradlew --no-daemon :core:testDebugUnitTest :code:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK and write checksum
        run: bash scripts/package-debug-apk.sh

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BIG-B-AI-Debug-APK
          path: |
            dist/BIG-B-AI-debug-*.apk
            dist/BIG-B-AI-debug-*.apk.sha256
          retention-days: 30
          if-no-files-found: error
