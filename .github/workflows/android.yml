name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fetch llama.cpp (pinned commit)
        run: bash scripts/fetch-llama.sh

      - name: Build native library (arm64-v8a, CPU only)
        run: bash scripts/build-native.sh

      - name: Unit tests
        run: gradle --no-daemon :core:testDebugUnitTest :code:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Assemble release APK
        run: gradle --no-daemon assembleRelease

      - name: Package APK with checksum
        run: bash scripts/package-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: big-b-ai-apk
          path: |
            dist/*.apk
            dist/*.sha256
            dist/*.txt
          if-no-files-found: error
