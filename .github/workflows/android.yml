name: Android CI - ITAGPT debug and release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apks:
    name: ITAGPT universal APK (3 ABIs, no bundled models, debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch llama.cpp (pinned revision)
        run: bash scripts/fetch-llama.sh

      # No model is fetched or packaged in 2.1. The APK contains the code and
      # the native engine only; weights are an explicit user choice in the app.
      - name: Build native libraries (all shipped ABIs)
        env:
          JOBS: 3
          ABIS: "arm64-v8a armeabi-v7a x86_64"
        run: bash scripts/build-native.sh

      - name: Unit tests (JVM, all modules)
        run: ./gradlew --no-daemon :core:testDebugUnitTest :code:testDebugUnitTest :llm:testDebugUnitTest :app:testDebugUnitTest

      - name: Lint (debug)
        run: ./gradlew --no-daemon :app:lintDebug

      # A real release keystore is optional. Without it the release is signed
      # with the debug key and explicitly named "release-debug-signed"; with it,
      # the packaging step fails unless the official certificate is present.
      - name: Prepare optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ITAGPT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/itagpt-release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/itagpt-release.jks" >> "$GITHUB_ENV"
            echo "REQUIRE_OFFICIAL_RELEASE_SIGNATURE=1" >> "$GITHUB_ENV"
            echo "Release signing: keystore dei Secrets configurato."
          else
            echo "REQUIRE_OFFICIAL_RELEASE_SIGNATURE=0" >> "$GITHUB_ENV"
            echo "Release signing: nessun keystore nei Secrets; uscirà una release debug-signed etichettata."
          fi

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release APK (R8 + resource shrinking)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ITAGPT_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ITAGPT_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ITAGPT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify debug APK, ABIs, absence of models and write report
        run: bash scripts/package-debug-apk.sh

      - name: Verify release APK, signature and absence of models
        run: bash scripts/package-release-apk.sh

      - name: Confirm every APK and checksum is readable
        run: |
          set -euo pipefail
          for APK in dist/ITAGPT-debug-*.apk dist/ITAGPT-release-*.apk; do
            test -s "$APK"
            SUM="${APK}.sha256"
            test -s "$SUM"
            (cd dist && sha256sum -c "$(basename "$SUM")")
            {
              echo "### $(basename "$APK")"
              echo "- size: $(stat -c%s "$APK") bytes"
              echo "- sha256: $(cut -d' ' -f1 "$SUM")"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITAGPT-Debug-APK
          path: |
            dist/ITAGPT-debug-*.apk
            dist/ITAGPT-debug-*.apk.sha256
            dist/ITAGPT-debug-*.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITAGPT-Release-APK
          path: |
            dist/ITAGPT-release-*.apk
            dist/ITAGPT-release-*.apk.sha256
            dist/ITAGPT-release-*.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload test, lint and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ITAGPT-CI-Reports
          path: |
            */build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.html
            dist/*.txt
          retention-days: 30
          if-no-files-found: warn
