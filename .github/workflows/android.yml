name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Universal debug APK (3 ABIs, ≥200 MiB, bundled embedding model)
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
          echo "NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fetch llama.cpp (pinned revision)
        run: bash scripts/fetch-llama.sh

      # The embedding model is a real component of the app, not padding: it is
      # pinned by size and SHA-256, verified again at runtime and checked once
      # more inside the packaged APK.
      - name: Fetch bundled embedding model (pinned SHA-256)
        run: bash scripts/fetch-bundled-model.sh

      - name: Build native library (3 ABIs)
        run: |
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          JOBS=3 ABIS="arm64-v8a armeabi-v7a x86_64" bash scripts/build-native.sh

      - name: Run unit tests
        run: ./gradlew --no-daemon :core:testDebugUnitTest :code:testDebugUnitTest :llm:testDebugUnitTest :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Package and verify APK (≥200 MiB)
        run: bash scripts/package-debug-apk.sh

      - name: Show APK metadata
        run: cat dist/BIG-B-AI-debug-*.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BIG-B-AI-Debug-APK
          path: |
            dist/BIG-B-AI-debug-*.apk
            dist/BIG-B-AI-debug-*.apk.sha256
            dist/BIG-B-AI-debug-*.txt
          if-no-files-found: error
          retention-days: 30
