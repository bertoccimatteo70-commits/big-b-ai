name: Android CI - Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: ITAGPT universal debug APK (3 ABIs, bundled embedding model)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3 requested the `tools` package by default.
      # Google removed it from the SDK repository, so the action failed with
      # "Failed to find package 'tools'". v4 no longer requests it; the command
      # line tools it installs replace it.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch llama.cpp (pinned revision)
        run: bash scripts/fetch-llama.sh

      # The embedding model is a real component of the app, not padding: it is
      # pinned by size and SHA-256, verified again at runtime and checked once
      # more inside the packaged APK.
      - name: Fetch bundled embedding model (pinned SHA-256)
        run: bash scripts/fetch-bundled-model.sh

      - name: Build native libraries (all shipped ABIs)
        env:
          JOBS: 3
          ABIS: "arm64-v8a armeabi-v7a x86_64"
        run: bash scripts/build-native.sh

      - name: Unit tests (JVM)
        run: ./gradlew --no-daemon :core:testDebugUnitTest :code:testDebugUnitTest :llm:testDebugUnitTest :app:testDebugUnitTest

      - name: Lint (debug)
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      # The packaging step is also the gate: it fails if an ABI, the embedding
      # model, its SHA-256, the signature or the manifest is wrong, and it is
      # the only place that names and hashes the file users download.
      - name: Verify APK, ABIs, model and write checksum + build report
        run: bash scripts/package-debug-apk.sh

      - name: Confirm the APK and checksum are readable and non-empty
        run: |
          set -euo pipefail
          APK="$(ls dist/ITAGPT-debug-*.apk | head -1)"
          SUM="${APK}.sha256"
          test -s "$APK"
          test -s "$SUM"
          (cd dist && sha256sum -c "$(basename "$SUM")")
          echo "APK: $APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: $(stat -c%s "$APK") bytes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$SUM" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITAGPT-Debug-APK
          path: |
            dist/ITAGPT-debug-*.apk
            dist/ITAGPT-debug-*.apk.sha256
            dist/ITAGPT-debug-*.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ITAGPT-CI-Reports
          path: |
            */build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.html
          retention-days: 30
          if-no-files-found: warn
