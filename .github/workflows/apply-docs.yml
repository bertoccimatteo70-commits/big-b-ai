name: apply-docs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply docs
        run: |
          set -euo pipefail
          curl -fsSL https://files.catbox.moe/8bo8pw.md -o README.md
          curl -fsSL https://files.catbox.moe/f3ot1x.md -o docs/LIMITATIONS.md
          curl -fsSL https://files.catbox.moe/49hj25.md -o docs/RELEASE-2.3.0.md
          git config user.name "ITAGPT"
          git config user.email "itagpt@users.noreply.github.com"
          git add README.md docs/LIMITATIONS.md docs/RELEASE-2.3.0.md
          git commit -m "docs: record the verified 2.3.0 build, APK hashes and artifact links"
          git push origin HEAD:main
