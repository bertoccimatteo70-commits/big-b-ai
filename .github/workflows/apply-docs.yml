name: apply-docs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scarica e verifica
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/hQO0M -o /tmp/docs.patch
          echo "4db0e6948fe3e3370380e6f3179be47c3cba6776f6c53d43159b30f263c05ea0  /tmp/docs.patch" | sha256sum -c -
      - name: Applica
        run: |
          set -euo pipefail
          git apply --index /tmp/docs.patch
          git config user.name "BIG B AI"
          git config user.email "bigbai@users.noreply.github.com"
          git commit -m "docs: APK 1.4.0 della CI, hash verificato e audit dinamico [skip ci]"
      - name: Pubblica
        run: git push origin HEAD:main
