name: Apply docs patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download patch and verify SHA-256
        env:
          PATCH_URL: https://paste.rs/uj7Fb
        run: |
          curl -fsSL "$PATCH_URL" -o /tmp/docs.patch
          echo "e3c706b8eb27ba53794300c88b28e541c20ab904f9f11d8a2fc5205d72d5ace0  /tmp/docs.patch" | sha256sum -c -

      - name: Apply patch and push
        run: |
          git config user.name "BIG B AI Bot"
          git config user.email "bot@users.noreply.github.com"
          git apply --index /tmp/docs.patch
          git commit -m "docs: record the verified 1.3.0 artifact size [skip ci]"
          git push origin HEAD:main
